# Configuracao das ferramentas do backend, e — desde 2026-08-28 — o MANIFESTO DO PROJETO.
#
# ── GERENCIADOR: POETRY (`ADR-011/D1`, supersede a decisao tatica de `T-01.1`) ──
#
# Ate 2026-08-28 este arquivo era so `[tool.*]`: as dependencias viviam em
# `backend/requirements-dev.txt` e o ambiente nascia de `uv venv` + `uv pip`. O owner
# derrubou a escolha:
#   "Aplicacao deve rodar com poetry, ter Makefile para simplicar as chamadas, builds e afins"
#   [PREMISSA-OWNER: 2026-08-28, citacao literal, registrada em `ADR-011/D1`]
# `T-01.6` executa. `requirements-dev.txt` FOI REMOVIDO — duas listas de dependencia para o
# mesmo ambiente divergem, e o dia em que divergirem ninguem sabera qual esta certa.
#
# Poetry 2.4.1 e PEP 621 [MEDIDO 2026-08-28: `poetry --version` -> `Poetry (version 2.4.1)`],
# entao a metadata do projeto mora em `[project]` e as dependencias de desenvolvimento em
# `[tool.poetry.group.dev.dependencies]`.
#
# `package-mode = false`: este backend NAO e um distribuivel hoje — zero dependencia de
# runtime, nenhuma aplicacao, e `src/` nao e pacote publicavel. Declarar o contrario faria
# `poetry install` tentar instalar a raiz como pacote e falhar por motivo que nao e o do
# repositorio. Ver o alvo `build` do `Makefile` da raiz, que RECUSA com `rc=3` em vez de
# devolver verde sobre artefato que nao existe.
#
# ── VERSAO DE PYTHON: 3.13, e a decisao INVERTEU (`ADR-011/D5` supersede `ADR-009/D4`) ──
#
# Ate 2026-08-28 este arquivo NAO declarava versao de proposito: `ADR-009/D4` decidia 3.12 e
# mandava REMOVER o `.python-version` = 3.13.13 da raiz. O owner derrubou as duas metades:
#   "essa questao do python, pode regredir, quero que tenha o python version no 3.13"
#   [PREMISSA-OWNER: 2026-08-28, citacao literal, registrada em `ADR-011/D5`]
# O `.python-version` FICA (3.13.13, rastreado) e 3.13 passa a ser DECLARADO.
#
# `D1.9` E CONJUNTO DE DUAS TASKS, e agora as duas rodaram: `T-01.4` declarou 3 superficies
# (`.python-version` da raiz, `[tool.mypy] python_version`, `[tool.ruff] target-version` — mais
# o `PY_ALVO` de `bootstrap.sh`), e `T-01.6` declara a QUARTA, `requires-python`, que so podia
# nascer aqui porque `[project]` so existe com Poetry. O comando do DoD
# (`grep -n 'requires-python|python_version|target-version|PY_ALVO'` sobre `pyproject.toml` +
# `bootstrap.sh`) devolvia 3 de 4 e agora devolve 4 de 4.

[project]
name = "cripto-strategy-backend"
version = "0.1.0"
description = "Backend da plataforma de dados de cripto: captura, contrato temporal e sentimento."
# Superficie 4 de 4 (`ADR-011/D5`), e a METADE QUE FALTAVA DE `D1.9`. Faixa fechada em cima:
# `>=3.13` sozinho autorizaria 3.14 em silencio, e `[tool.mypy] python_version = "3.13"` e
# `[tool.ruff] target-version = "py313"` passariam a descrever um alvo que o interpretador nao
# e mais. O assert de `backend/scripts/bootstrap.sh` confere a versao do venv que NASCEU.
requires-python = ">=3.13,<3.14"
# `T-07.9`/`CST-63` (plano `07` item 7.11) quebra o "zero dependencia de runtime" que valia ate
# aqui: `instrument_alias` e um contrato NOVO cujo formato o `SPEC-001` FIXA como "YAML
# versionado" (plano `07` linha 20). Escrever um parser de subconjunto de YAML a mao para fugir
# da dependencia trocaria uma biblioteca auditada por um parser proprio nao testado contra a
# gramatica real -- exatamente o debito tecnico que este repositorio recusa. Pin EXATO, pela
# mesma razao de `[tool.poetry.group.dev.dependencies]` abaixo: reprodutibilidade sobre
# conveniencia, e o `poetry.lock` versionado e o unico que segura o ambiente.
dependencies = ["pyyaml (==6.0.3)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
# As 6 dependencias de desenvolvimento, FIXADAS — herdadas de `backend/requirements-dev.txt`,
# que este bloco SUBSTITUI (o arquivo foi removido por `T-01.6`).
#
# Pin exato e nao faixa (`==` no requirements virou versao literal aqui, que o Poetry le como
# igualdade exata): o portao tem de rodar o mesmo em clone limpo. Quem afrouxar para `^` esta
# trocando reprodutibilidade por conveniencia, e o `poetry.lock` versionado deixa de ser a
# unica coisa que segura o ambiente.
#
# `import-linter` e a SEXTA, e ela entrou com `T-01.5` (`ADR-011/D3a`): e a ferramenta que
# avalia os contratos de `[tool.importlinter]` mais abaixo. `poetry add` a escreveu como
# `^2.14` e a linha foi CORRIGIDA para pin exato no mesmo ato — a faixa que o Poetry sugere
# por default e exatamente o afrouxamento que o paragrafo acima proibe.
coverage = "7.15.4"
import-linter = "2.14"
mypy = "2.3.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"
ruff = "0.16.5"
# `fakeredis` (`T-07.4`, `D7.10`) — DEV-ONLY, never `[project].dependencies`. Production code
# (`infra/redis_resp_client.py`) speaks RESP2 over a raw socket, same as every other network
# client in this tree; `fakeredis.TcpFakeServer` gives the test suite a REAL loopback listener
# that speaks the real Streams + consumer group protocol, so the client under test exercises the
# exact code path it would against a real Redis — without adding a runtime dependency or
# reaching outside localhost. Pinned exact, per the paragraph above.
fakeredis = "2.37.1"

[tool.pytest.ini_options]
# `pythonpath = ["."]` torna `src` e `tests` importaveis com a raiz em `backend/`, que e o
# diretorio de onde `backend/scripts/test.sh` roda. Sem isto o driver de subprocesso do
# teste de `D3.1` nao acha `src.modules.sentimento`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -q"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
# Piso GLOBAL. As metas POR CAMADA — o que `ADR-009/D1` copia do vizinho — sao verificadas
# por `backend/scripts/check-coverage-layers.sh`, porque um piso global sobe na camada
# barata (`infra`) enquanto `domain` fica descoberto.
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
# Superficie 3 de 4 (`ADR-011/D5`). Ate 2026-08-28 estava AUSENTE, e o `ruff` inferia o alvo
# do `requires-python` — que este arquivo nao tinha. Inferir de um campo inexistente e cair no
# default da ferramenta: alvo NAO declarado, que muda quando o `ruff` muda de versao.
target-version = "py313"

[tool.ruff.lint]
# `D` (pydocstyle) ACRESCENTADO em 2026-08-29 por `T-01.7`, e ele fecha um vazio MEDIDO:
# ate aqui a metade MENSURAVEL de `ADR-011/D6` — presenca e forma da docstring — nao estava
# em portao nenhum. `lint.sh:51` roda `ruff check src tests` SEM `--select D`, entao apagar
# uma docstring saia VERDE no portao que de fato reprova
# [MEDIDO 2026-08-29, em copia restaurada e conferida por sha256: com a docstring de
#  `JsonlCheckpoint.done()` apagada, `ruff check src tests` -> rc=0 "All checks passed!",
#  enquanto `ruff check --select D src tests` -> rc=1 `D102`]. Um portao que so existe
# digitado a mao no README nao e portao — e `ADR-011:268` ja tinha recusado a forma mais
# fraca ("ferramenta so no lint.sh fica fora do portao"); esta estava fora ate do lint.sh.
#
# ATENCAO AO QUE `D` MEDE, porque confundir isto e o defeito que `ADR-011/D6` passou o dia
# recusando: `D` mede PRESENCA e FORMA. Ele NAO mede IDIOMA, e NENHUMA regra `D` e sensivel
# a idioma. O idioma das docstrings e CONVENCAO DECLARADA, conferida por revisao humana, e
# declarar uma regra automatica de idioma REPROVA a fase (`plano 01`, `D1.10`).
select = ["E", "F", "I", "N", "UP", "B", "S", "ANN", "C90", "D"]

# As DUAS incompatibilidades do pydocstyle, resolvidas POR DECLARACAO e nao por desempate da
# ferramenta. O `ruff` ja escolhia exatamente estas duas, e avisava em stderr a cada rodada:
#   "D203 e D211 sao incompativeis. Ignorando D203."   "D212 e D213 ... Ignorando D213."
# Escrever a escolha faz duas coisas: cala o aviso no portao e torna a escolha DURAVEL — um
# desempate implicito muda quando a ferramenta muda de versao, que e a mesma classe de defeito
# que `target-version` acima existe para impedir.
#
# NAO E AFROUXAMENTO, e isso foi MEDIDO e nao presumido: o conjunto de regras `D` habilitadas
# e IDENTICO com e sem estas duas linhas [MEDIDO 2026-08-29: `ruff check --select D
# --show-settings` com e sem `--ignore D203,D213` -> os dois conjuntos batem exato; `D203` e
# `D213` ja estavam AUSENTES dos dois, e `D211`/`D212` presentes nos dois].
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Fixture de teste usa `assert` (S101) e chama subprocesso com argv literal (S603/S607).
"tests/**/*.py" = ["S101", "S603", "S607", "ANN401"]

[tool.mypy]
# Superficie 2 de 4 (`ADR-011/D5`). Ate 2026-08-28 esta seccao tinha so `strict` e
# `ignore_missing_imports`, e o `mypy` checava contra a versao do interpretador que o RODAVA —
# alvo por acidente de ambiente, nao por declaracao.
python_version = "3.13"
strict = true
ignore_missing_imports = true

# ── FRONTEIRA DE MODULO POR GRAFO DE IMPORTS (`ADR-011/D3a`, `T-01.5`, plano 01 item 1.9') ──
#
# Esta seccao e a peca 1 de `ADR-009/D1`, que ficou sem dono entre os itens do plano da fase
# 01 e foi o blocker remanescente do `/review` de `T-01.1`. Ela SUPERSEDE as duas
# `[[rules.own]]` de camada que nunca chegaram a existir (`own.layer-domain-up-import` e
# `own.layer-use-cases-imports-infra`).
#
# POR QUE GRAFO E MELHOR QUE REGEX, E O MOTIVO NAO E ESTETICA. As duas regras derrubadas
# casavam `from src.modules.<ctx>.<camada>` por LINHA DE TEXTO, e por isso dependiam de um
# argumento em duas pernas ("`core.relative-import` proibe todo import relativo, logo a forma
# absoluta e a unica legal") que e verdadeiro e FRAGIL. O `grimp` monta o grafo de imports e
# ve os tres casos que a regex de linha perdia: `import src.modules.x.infra as y`, re-export
# por `__init__.py`, e import dentro de funcao [DOC: ADR-011/D3a].
#
# LIMITE HERDADO, REGISTRADO PARA NAO VIRAR PROMESSA: `import-linter` TAMBEM e estatico. Ele
# NAO ve `importlib.import_module("src.modules.<ctx>.infra")` nem alias construido em runtime.
# A troca fecha os tres buracos acima e NAO fecha este. Quem precisar fechar o dinamico
# precisa de instrumentacao em tempo de execucao, que nenhuma task da fase 01 tem.
#
# ONDE ISTO E EXECUTADO: `make boundaries` -> `bash backend/scripts/boundaries.sh`, e o
# portao que o roda sozinho e `scripts/hooks/pre-push.pre-harness` (`ADR-011/D3b`). Sem esse
# portao, esta seccao seria ferramenta que existe e ninguem roda.

[tool.importlinter]
root_package = "src"
# Necessario para nomear pacote de FORA da arvore (`socket`, `ssl`) num contrato.
include_external_packages = true

# ── CONTRATO 1 de 2 — a direcao de camada, UM contrato para todos os contextos ──────────
#
# `containers` e a lista dos contextos: o contrato e aplicado DENTRO de cada um, e nao entre
# eles (a fronteira entre contextos e o contrato 2). Ordem das camadas: a PRIMEIRA e a mais
# alta. `infra` pode importar `use_cases`, que pode importar `domain`; o inverso reprova.
#
# `exhaustive = false` e o que permite a assimetria entre esta lista e a de contratos
# `forbidden`: um contexto pode ter contrato `forbidden` sem estar entre os `containers`, e
# um `container` pode ganhar subpacote que nao seja camada sem que o contrato reprove por
# isso. E a forma do vizinho [DOC: ADR-011/D3a — 1 contrato `layers` com 11 containers e 12
# contratos `forbidden`, e a assimetria 11x12 e justamente isto].
#
# HOJE `containers` TEM UMA ENTRADA SO, e isso e o disco e nao escolha: `src/modules/` tem
# exatamente um contexto [MEDIDO 2026-08-28: `ls backend/src/modules/` -> `__init__.py`,
# `sentimento`]. Quem criar o segundo contexto ACRESCENTA a linha aqui — e o contrato NAO o
# cobre ate que ela exista, porque `exhaustive = false` nao inventa container.
[[tool.importlinter.contracts]]
name = "Camadas por contexto: infra > use_cases > domain"
type = "layers"
layers = ["infra", "use_cases", "domain"]
containers = ["src.modules.sentimento"]
exhaustive = false

# ── CONTRATO 2 de 2 — a fronteira ENTRE contextos, um contrato por componente ───────────
#
# `sentimento` nao importa de outro contexto: contextos se falam por contrato publicado, nao
# por import direto. Os tres contextos nomeados (`charts`, `convergencia`, `backtest`) sao os
# componentes de codigo Python do vocabulario fechado [DOC: harness policy --key components ->
# sentimento, charts, convergencia, backtest, web, docs; `web` e o frontend TypeScript, que
# nao vive sob `src`, e `docs` nao e codigo].
#
# ⚠️ O QUE ESTE CONTRATO E HOJE, DITO EM VOZ ALTA: os tres modulos proibidos NAO EXISTEM no
# disco, e `import-linter` NAO recusa contrato que nomeie modulo inexistente — ele devolve
# `KEPT` [MEDIDO 2026-08-28: contrato identico a este, com o repositorio como esta ->
# `fronteira sentimento x charts KEPT`, rc=0]. Logo o lado "cala" deste contrato e VACUO hoje,
# e vacuo nao e prova. O lado "morde" NAO e vacuo e foi medido plantando o contexto vizinho
# junto com o violador (ver `backend/README.md`, secao da fronteira de modulo): o contrato
# reprova nomeando a linha exata. Ele esta DORMENTE E ARMADO, nao desligado — e a diferenca
# entre as duas so se conhece medindo, que e o que `D1.7e` exige.
#
# QUEM CRIAR O SEGUNDO CONTEXTO acrescenta o contrato `forbidden` DELE aqui embaixo. Nada
# neste repositorio obriga isso hoje: e divida nomeada, nao portao.
[[tool.importlinter.contracts]]
name = "Fronteira de contexto: sentimento nao importa outro contexto"
type = "forbidden"
source_modules = ["src.modules.sentimento"]
forbidden_modules = [
    "src.modules.charts",
    "src.modules.convergencia",
    "src.modules.backtest",
]


# ── CONTRATO 3 de 3 — a NATUREZA do que `domain` e `use_cases` podem tocar ──────────────
#
# ACRESCENTADO por `T-03.1` a partir do achado `A-5` do `/review`. Os dois contratos acima
# guardam a DIRECAO dos imports (`infra > use_cases > domain`) e a fronteira ENTRE contextos.
# Nenhum dos dois olha a NATUREZA da dependencia: `[MEDIDO 2026-08-29 pelo /review, e
# reproduzido aqui] domain/ importando `socket` e abrindo `ssl.create_default_context()`
# passava por TODOS os portoes deste repositorio` — ruff, mypy --strict, pytest, lint-imports
# e o sweep. A camada estava limpa por DISCIPLINA, e disciplina nao e mecanismo: o proximo
# modulo de I/O nao herda o cuidado com que este foi escrito.
#
# O repositorio ja declarou esta forma para o mesmo tipo de fronteira em `ADR-014/D1d`
# (contrato proibindo o motor em `domain`/`use_cases`). Este e o mesmo instrumento.
#
# ── ESTREITADO por `ADR-016/D2` + `T-03.12` (`ADR-016/D5`) — `time`/`datetime` SAEM daqui ──
#
# `T-03.10` poe em `domain/` dois modulos (`dump_window.py`, `retention_probe.py`) que
# importam `date`/`timedelta` para aritmetica de calendario PURA, sem ler relogio nenhum —
# e este contrato, como estava, os reprovava pelo MODULO inteiro (`E1` da `ADR-016`: a linha
# acusada e sempre a do `import`, com ou sem `datetime.now()` dentro). `ADR-016/D1` decide que
# a distincao certa e CAPACIDADE x VALOR, nao "o modulo inteiro": `socket`/`ssl` sao
# capacidade pura (nada legitimo para `domain/` fazer com transporte) e ficam AQUI, por
# import; `time`/`datetime` misturam valor (`date`, `timedelta`) com capacidade
# (`.now()`, `.today()`, `.sleep()`) e passam a ser guardados POR USO, em
# `backend/scripts/natureza.py` (`make natureza`, chamado por
# `scripts/hooks/pre-push.pre-harness` na MESMA costura deste contrato).
#
# ATOMICO com o nascimento do portao (`ADR-016/D5`): `natureza.py`/`natureza.sh` entram no
# MESMO commit que estreita este `forbidden_modules` — estreitar antes abriria uma janela em
# que `datetime.now()`/`date.today()` novos em `domain/` nao seriam pegos por NADA (`E2` da
# `ADR-016`: `ignore_imports` sai `3 kept, 0 broken` com as duas leituras DENTRO de `domain/`).
#
# AS DUAS METADES, MEDIDAS — e o criterio de admissao que `ADR-012` exige, porque contrato que
# so foi visto CALAR e vacuo:
#   CALA  na arvore como esta -> `3 kept, 0 broken`. Os `socket`/`ssl` do CLI vivem em
#         `infra`, que NAO e `source_module` deste contrato.
#   MORDE com `import ssl` plantado em `domain/` -> `2 kept, 1 broken`, nomeando a linha E a
#         cadeia transitiva (`E5` da `ADR-016`, reproduzida no portao pela `T-03.12`, DoD-6).
[[tool.importlinter.contracts]]
name = "Natureza: domain e use_cases nao falam com socket nem ssl"
type = "forbidden"
source_modules = [
    "src.modules.sentimento.domain",
    "src.modules.sentimento.use_cases",
]
forbidden_modules = ["socket", "ssl"]
