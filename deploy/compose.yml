# Read-and-write layer of the `/painel` dashboard — extended by F3 (`captura-em-producao`,
# SPEC-004 §3.6) to carry the write side end-to-end. Exactly 7 services, no more
# (`ADR-032/D1`, `CA-F3-5`): Postgres (`ADR-031/D2` — `timescale/timescaledb:2.17.2-pg15`,
# the same image `ADR-002/D4` measured), Redis as the wire (`ADR-032/D4`), the `api`
# process (c) (`ADR-027/D1`), `writer` and `collector` — the SAME backend image, only the
# `command:` differs (`ADR-027/D1`, literal: "mesma imagem, comando diferente") — the
# Next.js reader (`ADR-028`) and a single-origin Caddy (`ADR-029/D1`) in front of both.
# Structured and validated by `config -q` (`D3.1`) — NOT a deployment: nothing here is
# ever brought up on a real host (`RN-9`/`R-E`). The inverse of the scope is the
# falsifier: `docker compose -f deploy/compose.yml ps` showing any of these 7 services
# on the VPS means this scope was violated.
#
# No `profiles:` in this file (`NG-6`, `D3.4`'s falsifier) — that lives only in the local
# overlay (`deploy/compose.local.yml`, `T-03.5`), which this file does not reference.
#
# WHAT THIS FILE IS NOT: it does not decide auth mechanism or TLS (`[Q3]`/`[Q10]`,
# owner) — `caddy`'s `basic_auth` block stays inert until `PANEL_BASIC_AUTH_HASH` is
# set (ADR-029/D6), and `deploy/Caddyfile` (routing itself) is T-02.7, not this file.
# Liveness of `writer`/`collector` is fail-fast on boot plus `/collector-status` turning
# `PARADO` after `stale_after_s` (`ADR-032/D5`, `ADR-030/D1`) — a command `healthcheck:`
# for those two is declared, not implemented, pending `T-03.6`'s gate (`[Q6]`).
#
# WHY IT IS VERSIONED: it is the legitimate half of the `D1.14`/`F-029-6` falsifier.
# The biting half is an ephemeral violator that never enters the tree — a versioned
# violator would leave `harness rules --mode sweep` red and `pre-push` would refuse.
# The silent half has to be real, reproducible and committed:
#
#     harness rules --mode file --path deploy/compose.yml   # empty output, exit 0
#
# EVERY credential is read from the environment. That is not style: it is the property
# `own.compose-hardcoded-secret` enforces, and this file is the conforming case that
# proves the rule does not bite the correct shape.
#
# `api` never publishes a port (ADR-029/D5, RNF-5) — `web` and `caddy` reach it only
# by service name on the compose network (`http://api:${APP_PORT}`); the Next server
# reads the same address from `INGEST_HEALTH_API_BASE_URL` (`.env.example`). Reaching it
# by service name needs `api` to LISTEN on more than its own container's loopback —
# `[DECISAO-OWNER: 2026-09-08]` (`backend/src/main/__main__.py`'s own docstring), the `api`
# service below sets `APP_HOST=0.0.0.0`. `writer`/`collector` never call `uvicorn.run`, so
# neither one carries this variable.
services:
  # `ADR-031/D2` — the same `timescale/timescaledb:2.17.2-pg15` image `ADR-002/D4` measured
  # against its 5 criteria (`F4`'s falsifier). Postgres-compatible: `pg_isready` and every
  # existing client keep working unmodified.
  postgres:
    image: timescale/timescaledb:2.17.2-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The wire between `collector` and `writer` (`ADR-032/D4`) — `REDIS_STREAM_MAXLEN` caps
  # the stream (`XADD … MAXLEN ~`, `redis_stream_bus.py`) and `maxmemory-policy noeviction`
  # means a full buffer fails the write loudly instead of silently dropping (`M4(a)`).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Process (c) of ADR-027/D1 — "already exists (`src.main`)". Same Python image as the
  # rest of the backend; command overrides whatever the image's default entrypoint is.
  # No `ports:` (ADR-029/D5): reachable only as `api:${APP_PORT}` on this network.
  api:
    build:
      context: ../backend
    command: python -m src.main
    restart: unless-stopped
    env_file:
      - ../.env
    # `APP_HOST` overrides `__main__.py`'s `"127.0.0.1"` default so `web`/`caddy` can reach
    # this process by service name (`[DECISAO-OWNER: 2026-09-08]`, comment above). `env_file`
    # above still supplies every OTHER variable (`APP_PORT` included) — this is the ONE
    # variable this service pins regardless of what `.env` says, because it is a topology
    # fact of running under compose, not an operator-tunable setting.
    environment:
      APP_HOST: "0.0.0.0"
    # `T-03.8` (`CA-E2E-1`) measured this: `create_app` ALWAYS wires a
    # `SqliteSeriesQuarantineStore` at `QUARANTINE_STORE_PATH` (default
    # `data/md/series_quarantine.sqlite3`, `src/main/__init__.py:64/240`) regardless of
    # `INGEST_RECORD_BACKEND` — there is no `postgres` variant of that store. `backend/.dockerignore`
    # excludes `data/` from the image (`T-03.1`, `D3.6`'s falsifier needs that), so the parent
    # directory never exists at boot and `_require_parent_directory` refuses with
    # `StoreParentDirectoryMissingError` before uvicorn ever binds a socket — `api` crash-loops on
    # every `$D up`/`$L up` without this volume (`[MEDIDO 2026-09-08]`: `docker logs` showed
    # `store_parent_missing ... series quarantine store parent directory does not exist: data/md`
    # on every restart). A named volume at the exact mount path makes Docker create the full
    # directory chain — same pattern `postgres_data`/`redis_data` already use below — and gives the
    # quarantine data the SAME persistence-across-restart guarantee those two already have.
    volumes:
      - api_data:/app/data/md
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The single writer (`ADR-009/D2`) — the ONLY process ever holding an open write
  # connection to the ingest tables (`ADR-009/D3`). SAME image as `api`; only `command:`
  # differs (`ADR-027/D1`). `depends_on: … service_healthy` only proves Redis/Postgres are
  # reachable before this starts — a stalled writer after boot is caught by
  # `/collector-status` turning `PARADO` (`ADR-030/D1`), not by a `healthcheck:` here
  # (`ADR-032/D5`, `[Q6]` decided by `T-03.6`).
  writer:
    build:
      context: ../backend
    command: python -m src.modules.sentimento.infra.single_writer_cli
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Publishes to the Redis stream `writer` drains, and validates `INGEST_RECORD_BACKEND`
  # against Postgres via the same shared composition (`compose_ingest_record_store`,
  # `collectors_cli.py`) — hence `depends_on` both. SAME image as `api`/`writer`.
  #
  # SEVEN threads since `T-03.4` (`SPEC-009` phase `03a`). The five `T-04.3` (`SPEC-007` phase
  # `04`) left: `forceOrder` (stream), `premiumIndex` (poll), `/fapi/v1/klines` and
  # `/futures/data/openInterestHist` (both poll + a one-off backfill at boot) and
  # `/futures/data/globalLongShortAccountRatio` (poll + a one-off full page at boot); then the
  # Coinalyze liquidation poll (`T-05.5`, `SPEC-007` phase `05`) and `/fapi/v1/openInterest`
  # (`T-03.4`: poll aligned to the 1-minute grid, NO backfill — the endpoint serves only the
  # present value). The CADENCE
  # variables live in `../.env`, which `env_file:` below supplies — NOT in an `environment:`
  # block here, and that is deliberate: `environment:` takes precedence over `env_file:`, so
  # pinning a default here would SILENTLY override whatever the operator wrote in `.env`. The
  # one variable this file does pin that way is `api`'s `APP_HOST`, and its comment says why
  # (a topology fact of running under compose, not an operator-tunable setting). Cadence is
  # the opposite — `RS-3.5`: *"e a unica variavel que paga cota, e grava-la em codigo
  # transforma ajuste de configuracao em release"*.
  #
  #   PREMIUM_INDEX_CYCLE_INTERVAL_S   default 60      seconds between premiumIndex polls
  #   KLINES_CYCLE_INTERVAL_S          default 60      seconds between klines polls; the series
  #                                                    is 1-minute, so below 60 buys only quota
  #   KLINES_CYCLE_OFFSET_S            default 20      seconds PAST each grid point at which the
  #                                                    aligned poll fires; must be in
  #                                                    [0, KLINES_CYCLE_INTERVAL_S). It is the
  #                                                    PHASE, not a cadence: the cycle sleeps
  #                                                    until `bucket_end + offset`, so the
  #                                                    period stays the cadence no matter how
  #                                                    long the work took. Lowering it does NOT
  #                                                    fail loudly, and the previous text here
  #                                                    said it did -- there is no clock skew to
  #                                                    blame and the anti-lookahead cut drops
  #                                                    NOTHING: the venue SERVES the bar as
  #                                                    closed while still amending it, so we
  #                                                    write a PREFIX of it with
  #                                                    `is_final=True` and never re-read. See
  #                                                    `ADR-041`: at +2 s, 32 of 52 bars had the
  #                                                    volume understated; at +10 s and +30 s,
  #                                                    zero `[MEDIDO 2026-09-19, n=52]`
  #   KLINES_BACKFILL_DAYS             default 7       days read once at boot (7 x 1440 = 10.080
  #                                                    bars per symbol = 7 calls of 1500)
  #   OPEN_INTEREST_CYCLE_INTERVAL_S   default 60      seconds between openInterestHist polls;
  #                                                    the series is 5-minute but the point is
  #                                                    published ~6 s after its own label
  #                                                    `[MEDIDO 2026-09-12]`, so a 60 s cycle
  #                                                    picks it up on the next turn
  #   OPEN_INTEREST_BACKFILL_DAYS      default 7       days read once at boot (7 x 288 = 2.016
  #                                                    points per symbol = 5 calls of 500).
  #                                                    ⛔ TETO DA FONTE: `/futures/data/*` corta
  #                                                    em ~30 dias — `startTime` de -35 d
  #                                                    devolve HTTP 400 `code:-1130`
  #                                                    `[MEDIDO 2026-09-12]`. Acima disso o
  #                                                    backfill fecha como END OF HISTORY sem
  #                                                    escrever linha.
  #   LONG_SHORT_CYCLE_INTERVAL_S      default 60      seconds between long/short polls; the
  #                                                    series is 5-minute and the SOURCE grid is
  #                                                    5 min too `[MEDIDO 2026-09-12, n=499
  #                                                    gaps: inter-chegada == 300.000 ms exatos]`,
  #                                                    so below 60 buys nothing. There is NO
  #                                                    backfill-days twin: `/futures/data/*`
  #                                                    takes no window on the tail call, and the
  #                                                    boot pass asks the endpoint's own ceiling
  #                                                    (limit=500 = ~41,7 h per symbol).
  #   OPEN_INTEREST_POLL_CYCLE_INTERVAL_S
  #                                    default 60      seconds between `/fapi/v1/openInterest`
  #                                                    polls (`T-03.4`; `[Q-CAD-1] = 60 s`,
  #                                                    `[DECISAO-OWNER: 2026-09-23, 2a
  #                                                    rodada]`). NOT a twin of
  #                                                    `OPEN_INTEREST_CYCLE_INTERVAL_S` above:
  #                                                    that one reads the 5-minute HISTORY, this
  #                                                    one samples the PRESENT value onto a
  #                                                    1-minute grid, one call per symbol `5 s`
  #                                                    before each minute `T` (`[Q-STAMP-1]` §3
  #                                                    — the lead is a contract in code, not a
  #                                                    knob here). ⛔ MUST be a whole multiple
  #                                                    of 60: the collector REFUSES anything
  #                                                    else at boot, because `30` would send
  #                                                    every other call at `T + 25 s`, outside
  #                                                    the stamp's `[T - 20 s, T]` window —
  #                                                    quota spent, nothing written, silently.
  #                                                    Raising it (120, 180...) is legal and
  #                                                    thins the series: at 120, half the
  #                                                    minutes are ABSENT by construction, and
  #                                                    `03a` DoD-1 (>= 0,95 x 1.440 points per
  #                                                    symbol per day) stops being reachable
  #
  # Quota, so the numbers are not adjectives: weight 1 per klines call against 2400 weight/min
  # per IP `[MEDIDO 2026-09-10: sequencia 31->32->33]` — four symbols at 60 s spend 4 of 2400.
  # The long/short thread spends 4 calls/min on `/futures/data/*`, a family that answers `200`
  # with ZERO `x-mbx-*` headers (`domain/clock_skew.py`, `T-03.7`) — so its weight is UNREADABLE
  # rather than zero, and its runs carry `WEIGHT_NOT_READABLE` instead of a derived number.
  # The boot backfill publishes `7 x 1440 x |symbols|` entries onto the Redis stream, under the
  # `REDIS_STREAM_MAXLEN` cap (default 100.000, `redis_stream_bus.py`); with the four-symbol
  # universe that peak is 40.320, i.e. 40% of the cap. An operator who raises
  # `KLINES_BACKFILL_DAYS` past ~17 days on four symbols must raise `REDIS_STREAM_MAXLEN` with
  # it, or `XADD ... MAXLEN ~` will trim entries the writer has not drained yet.
  #
  # Open interest is CHEAP against that cap by a factor of five (5-minute grid, not 1-minute):
  # `7 x 288 x 4 = 8.064` entries at boot, 8% of the default cap, and 4 entries per 60 s cycle.
  # Its quota cost cannot be priced the same way because `/futures/data/` publishes NO
  # `x-mbx-*` header at all — what IS measured is that the limit was not reached:
  # `[MEDIDO 2026-09-12: 60 chamadas consecutivas em 22,5 s (2,67 req/s) -> 60x HTTP 200, zero
  # 429/418]`, against a production cadence of 4 chamadas / 60 s = 0,067 req/s, 40x abaixo da
  # taxa sondada que nao disparou.
  #
  # The PRESENT open interest poll (`OPEN_INTEREST_POLL_CYCLE_INTERVAL_S`) is the opposite case
  # on both counts. Quota IS readable: `/fapi/v1/*` publishes `x-mbx-used-weight-1m`, weight 1
  # per call `[DOC + MEDIDO 2026-09-23: header 16->17->18->19 em 4 chamadas seguidas]`, so four
  # symbols at 60 s spend 4 of 2.400/min, 0,17% `[MEDIDO 2026-09-23: exchangeInfo -> rateLimits]`
  # (`SPEC-009` §6.1). There is NO retry, so its share cannot pass 4/min — a failed call is an
  # absent minute, not a second call. The stream cost has no boot peak at all (no backfill):
  # 4 entries per cycle. Disk is the one number still to be measured: ~570 KB/day, ~208 MB/year
  # at 60 s `[INFERRED: SPEC-009 §6.1, 5.760 linhas/dia x 99,06 B/linha de SPEC-008 §4]`; the
  # measurement after 24 h is `03a` item 3a.5, and past 2x (1,14 MB/day) it goes back to the
  # owner (`[Q-CAD-1]`).
  collector:
    build:
      context: ../backend
    command: python -m src.modules.sentimento.infra.collectors_cli
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── O BACKFILL PROFUNDO NAO E UM SERVICO, E POR ISSO NAO TEM BLOCO AQUI ──────────────────
  #
  # `T-01.5` / `SPEC-008` plano `01` item 1.6, `ADR-027/D1`. `KLINES_BACKFILL_DAYS` acima
  # aprofunda o boot do `collector` — e o boot dele re-le a janela inteira a CADA restart, num
  # servico cujo `restart:` e `unless-stopped`. No teto de `D5` isso seria
  # `90 x 1440 x 4 simbolos x 6 identidades = 3.110.400` linhas apendadas por restart. Por isso
  # a profundidade de 90 dias tem entrypoint PROPRIO, que roda uma vez e SAI:
  #
  #   docker compose -f deploy/compose.yml run --rm --no-deps collector \
  #     python -m src.modules.sentimento.infra.klines_backfill_cli
  #
  # ⛔ NAO declare isso como `service:` deste arquivo. Um servico aqui sobe em todo
  # `compose up` e vira o quarto processo de vida longa que `ADR-027/D1` recusa. Agendar e ato
  # do operador (`cron` do host chamando a linha acima), nao deste compose.
  #
  #   KLINES_BACKFILL_ONE_SHOT_DAYS    default 90      profundidade do one-shot. E TETO, nao
  #                                                    sugestao: acima de 90 o processo recusa
  #                                                    no boot nomeando a variavel, nunca
  #                                                    corta em silencio
  #                                                    `[DECISAO-OWNER: 2026-09-19]`
  #   KLINES_BACKFILL_MAX_STREAM_LAG   default 20000   quantas entradas o escritor unico pode
  #                                                    estar atrasado antes de o walk PARAR de
  #                                                    publicar. Tem de ficar abaixo de
  #                                                    REDIS_STREAM_MAXLEN, ou `XADD MAXLEN ~`
  #                                                    descarta entrada que o escritor ainda
  #                                                    nao leu — perda SILENCIOSA
  #   KLINES_BACKFILL_LAG_POLL_S       default 1       segundos entre duas sondagens de
  #                                                    `XINFO GROUPS` enquanto espera drenar

  # Next.js server (`ADR-028/D1`, Server Component reads the API). No `ports:` either
  # — `caddy` is the only service exposed, and it proxies the rest of the host to here.
  web:
    build:
      context: ../frontend
    command: npm start
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - api

  # Single reverse proxy, own to this project (ADR-029/D1) — routes `${API_PREFIX}/*`
  # to `api` and everything else to `web`, both by service name, same origin (D2). The
  # routing itself (`deploy/Caddyfile`) is T-02.7; this only wires it into the compose
  # network. `PUBLIC_HOST`/`PANEL_BASIC_AUTH_HASH` come from `.env` — never a literal.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  api_data:
