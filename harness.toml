# Política do harness deste repositório.
#
# O mecanismo vem do plugin; a política mora aqui e é o único arquivo pelo qual o
# mecanismo lê este repositório.
#
# ── O ESTADO EM QUE ESTA POLÍTICA FOI ESCRITA ──────────────────────────────────────
#
# Escrita em 2026-08-22, quando o repositório continha `docs/proposta-discovery.md` e
# NADA MAIS: zero código, discovery ainda não iniciado. Os campos que descrevem código
# (`code_paths`, `test_globs`) descrevem uma INTENÇÃO declarada pelo owner (backend
# Python modular + FastAPI, frontend Next.js), não uma medição — não há o que medir.
# Onde não há medição, este arquivo diz que não há, em vez de emprestar a confiança de
# um número inventado. Precedente e molde: `comparador-preco/harness.toml`.

schema_version = 1

# Vocabulário fechado de componente.
#
# Derivado da decomposição que a própria proposta faz (§2, Módulos A–D), mais as duas
# superfícies de stack que o owner declarou na criação do projeto:
#
#   sentimento   — Módulo A: ingestão de OI/Funding/L-S Ratio (Coinalyze, Binance,
#                  Bybit), pipeline event-driven, screener de anomalias, CVD via WS.
#   charts       — Módulo B: engine de gráficos (Lightweight Charts) e detecção
#                  programática de SMC (OB, FVG, BSL/SSL, BOS/CHoCH).
#   convergencia — Módulo C: matriz de confirmação cruzada e regras de gatilho.
#   backtest     — Módulo D: banco time-series, motor de backtest event-driven,
#                  paper trading/testnet, dashboard de métricas.
#   web          — frontend Next.js (dashboard, painéis sincronizados, presets).
#   docs         — o que já existe hoje.
#
#   infra        — a camada consumidora (`src/api/`, `src/jobs/`) e o que serve o
#                  processo: `deploy/` (compose, reverse proxy, TLS), backup e
#                  topologia. ACRESCENTADO em 2026-09-03, 6 -> 7 — ver o bloco abaixo.
#
# Diferente do comparador-preco, nenhum módulo foi deixado de fora: a proposta (§1)
# coloca os quatro como objeto do MESMO discovery, não como fases futuras.
#
# ── `infra`: O ATO DE POLÍTICA, E O MOTIVO ESCRITO ────────────────────────────────
#
# `[DECISÃO-OWNER: 2026-09-03, escolha entre alternativas apresentadas]` — NÃO é fala
# do owner: ele escolheu a opção `A` de um menu de três que o `/architect` redigiu,
# com o custo de cada uma declarado (`CLAUDE.md` §"os dois rótulos de owner não são o
# mesmo ato"). Alterar o vocabulário fechado é ato do owner, e este é o ato.
#
#   ADOTADO — `infra`. Custo aceito, na redação do menu: "põe o schema HTTP e o
#   TLS/compose sob o mesmo juiz — duas classes de risco diferentes com um só dono".
#
#   RECUSADA — `api`: "nome preciso para a API, mas MENTE para o worker (`jobs/` não
#   é API) e deixa `ADR-009/D5` aberto para `deploy/`/backup => duas decisões em vez
#   de uma".
#
#   RECUSADA — nenhum rótulo: "zero ato de política, mas cai em `ADR-003:11-13`
#   (componente sem dono de julgamento) e faria `sentimento` rotular código que não é
#   dele — falso por construção".
#
# O que o rótulo faz, MEDIDO e menos do que a primeira redação da decisão afirmava:
# afeta SÓ `components` + `[agents.by_component]` (`V-16`, `lib/policy.py:539-543`) —
# ou seja, QUEM JULGA. `[code_paths]` e `require-code` não dependem dele
# [MEDIDO 2026-09-03: `harness code-paths classify backend/src/api/...` já devolve
# `producao` sem rótulo nenhum; `backend/src` é 1 dos 21 prefixos —
# `harness pipeline scope plataforma-dados list | grep -c '^'`].
#
# ⚠️ A CARDINALIDADE ACIMA JÁ NASCEU VELHA UMA VEZ, e o registro fica: esta linha
# dizia `19` quando foi escrita às 23:48Z, mas o escopo virou 21 às 22:51Z — ANTES
# dela — quando o owner autorizou `scope add .claude/agents` e `add docs/INDEX.md`.
# A conclusão sempre foi verdadeira (`require-code` responde "permitido (scope)");
# só o número morreu. Achado pelo `/qa` da `T-09.4`. É a mesma família do defeito
# que `boundaries.sh` carregava: número sem re-medição envelhecendo DENTRO de um
# arquivo que é portão. Por isso o comando que o reproduz agora vem ao lado.
#
# ⛔ RÓTULO NÃO É COBERTURA: `infra` no enum NÃO faz `deploy/` ser medido por nada —
# `code_paths.include_prefixes` tem 3 entradas e `ls -d deploy` é inexistente
# [MEDIDO 2026-09-03]. Quem fecha isso é o item `1.14` do plano `01`, não este ato.
#
# ⛔ ESTE ATO NÃO DECLARA O JUIZ. `[agents.by_component.infra]` é `T-01.8`, e a ordem
# não é preferência: `V-16` reprova componente fora do enum, logo `components` de 6
# para 7 PRIMEIRO, juiz DEPOIS. `infra` no enum e ausente de `[agents.by_component]`
# é a condição que `ADR-009/F-D6-6` existe para acusar — ela é CONHECIDA, DATADA e
# fecha em `T-01.8`.
#
# Registro: `ADR-009` §D6.5 e §D6.8 · item `9.6` / DoD `D9.6` do plano `09` ·
# `docs/decisoes-do-owner.md` §"2026-09-03 — o rótulo da camada de API".
components = ["sentimento", "charts", "convergencia", "backtest", "web", "docs", "infra"]

