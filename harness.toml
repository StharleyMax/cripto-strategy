# **Mensagem em português, e a escolha é declarada:** ela é **microcopy de operador**
# (linha 8 da tabela de fronteira do `CLAUDE.md`) — o texto que sai no terminal ao lado dos
# outros 10 `[BLOQUEIO]`, todos em português. Escrevê-la em inglês criaria uma saída
# bilíngue numa mesma listagem. Sem acento, como as 10 do plugin.
[[rules.own]]
id = "own.compose-hardcoded-secret"
form = "forbidden-regex-allowlist"
modes = ["file", "sweep"]
severity = "block"
scope = "code"
paths = ["**/*.yml", "**/*.yaml"]
# Lê-se: início de linha, uma chave YAML (ou item de lista `- CHAVE=…`) cujo nome contém um
# termo de credencial, seguida de `:` ou `=` e de um valor LITERAL de 6+ caracteres.
# O `^` ancora na linha porque o motor avalia linha a linha (`lib/rules.py:198-200`), e a
# âncora é o que impede o casamento de escorregar para dentro de `${VAR:?...}` — sem ela,
# `POSTGRES_PASSWORD: ${DB_PASSWORD:?informe_a_senha}` casaria pelo SEGUNDO `PASSWORD` e a
# indireção correta viraria violação.
# A classe negada no regex abaixo (espaço, aspa dupla, aspa simples, chaves, cifrão)
# recusa o valor interpolado: `$` e `{` fora dela = `${…}` não é literal. É o predicado
# que separa "senha no arquivo" de "senha lida do ambiente".
regex = "^\\s*-?\\s*[\"']?[A-Za-z0-9_.-]*(?i:password|passwd|secret|api[-_]?key|access[-_]?key|token|dsn|connection_string)[A-Za-z0-9_.-]*[\"']?\\s*[:=]\\s*[\"']?[^\\s\"'{}$]{6,}"
# Cada entrada existe por um caso REAL de compose, e nenhuma delas é "menos rigor":
#   `[:=]\s*["']?\$\{`          — interpolação de fato NO VALOR (logo após o `:`/`=`);
#   `_file\s*[:=]`              — o padrão de segredo do Docker: `POSTGRES_PASSWORD_FILE:
#                                 /run/secrets/db`. É o CONSERTO, e uma regra que morde o
#                                 conserto ensina a desligá-la; é checagem de CHAVE, não de
#                                 valor, então não sofre do defeito abaixo — já nasceu ancorada;
#   `[:=]\s*["']?/run/secrets/` — o mesmo padrão pelo lado do valor;
#   `[:=]\s*["']?(?i:example|placeholder|changeme|dummy|redacted)` — valor de amostra
#                                 declarado como amostra.
#
# **As 3 entradas de VALOR (1ª, 3ª, 4ª) mudaram em `T-01.10` rodada 2 — achado real do QA,
# não estilo.** Até então cada uma era `re.search()` sobre a LINHA INTEIRA
# (`lib/rules.py:205-216`: o motor testa `allow.search(ln)` para a linha completa, sem
# nenhum vínculo com o valor capturado pelo `regex` principal depois do `:`/`=`) — e isso
# calava qualquer linha que tivesse a palavra da allowlist EM QUALQUER LUGAR, valor ou não:
#   (A) `POSTGRES_PASSWORD: hunter2_prod_master${UNUSED}` — segredo LITERAL seguido de um
#       `${...}` decorativo e morto; a allowlist antiga via o `${` no fim da linha e calava
#       a ocorrência inteira, quando o valor real (`hunter2_prod_master`) não tinha indireção
#       nenhuma `[MEDIDO 2026-09-03, QA rodada 1, Ataque 4(A): harness rules --mode file
#       --path <efêmero> -> vazio, rc=0]`;
#   (B) `POSTGRES_PASSWORD: hunter2_prod_master  # changeme depois` — mesma causa: a palavra
#       de amostra estava no COMENTÁRIO, não no valor, e a allowlist antiga não distinguia
#       `[MEDIDO 2026-09-03, QA rodada 1, Ataque 4(B): idem, rc=0]`.
# **A correção ancora cada allowlist de valor ao MESMO ponto de partida do valor que o regex
# principal usa** (`[:=]\s*["']?`, o trecho logo após a chave) — então só calam quando o
# padrão de exceção é, ele mesmo, o INÍCIO do valor, não um apêndice ou um comentário.
# Reprova de regressão: as 3 linhas do corpus `conforming/` que dependiam de valor
# (`01_env_interpolation.yml`, `02_docker_secrets_file.yml` via `_file` — inalterada —,
# `03_secret_in_test_path.yml`) continuam calando; `harness corpus verify` abaixo é a prova.
# Efeito colateral notado e aceito: a 1ª entrada (`\$\{`) fica, na prática, redundante para
# valor 100% interpolado — a classe negada do regex principal (`[^\s"'{}$]{6,}`) já barra
# esses casos ANTES de qualquer allowlist ser avaliada, porque o valor não tem 6 caracteres
# literais para casar `[MEDIDO: harness corpus verify — `conforming/01` cala por
# "main-no-match", não por entrar na allowlist]`. Ela permanece por defesa em profundidade
# (mudança futura no regex principal) e porque removê-la não fecha nada a mais.
allowlist_regex = ["[:=]\\s*[\"']?\\$\\{", '(?i)_file\s*[:=]', "[:=]\\s*[\"']?/run/secrets/", "[:=]\\s*[\"']?(?i:example|placeholder|changeme|dummy|redacted)"]
message = "segredo literal em arquivo de compose: leia-o do ambiente (`${VAR}`) ou de `/run/secrets` — credencial versionada nao volta atras"

# **(C) YAML flow-style, `[NÃO MEDIDO]` — lacuna aberta, mesmo padrão do `Dockerfile` acima:**
# `environment: {POSTGRES_PASSWORD: hunter2_prod_master}` nunca é avaliado. O `regex`
# principal ancora em `^\s*-?\s*` (início de LINHA), e o motor avalia linha a linha
# (`lib/rules.py:198-216`) sem entender YAML — uma chave dentro de `{...}` na MESMA linha
# de outra chave (`environment:`) não começa a linha, então o `^` nunca casa com ela
# `[MEDIDO 2026-09-03, QA rodada 1, Ataque 4(C): harness rules --mode file --path <efêmero>
# -> vazio, rc=0]`. Estender o regex para casar flow-style exigiria reconhecer `{`/`}`
# e múltiplos pares `chave: valor` separados por vírgula NA MESMA linha — o motor deste
# `form` é `forbidden-regex-allowlist` avaliado por LINHA, não um parser YAML, e forçar
# essa forma a entender estrutura aninhada é o tipo de regex frágil que o resto deste
# arquivo evita (ver a nota de `\$\{` acima sobre "cinto e suspensório" que virou buraco).
# **Custo aceito, e é zero hoje:** `git ls-files 'deploy/*.yml' 'deploy/*.yaml' | xargs
# grep -nE '[^$]:[[:space:]]*\{'` → `rc=1`, nenhuma linha `[MEDIDO 2026-09-03]` — o padrão
# exclui `$` imediatamente antes de `:` de propósito, porque um grep ingênuo
# (`\{[^}]*:[^}]*\}`) SUBCONTA como flow-style a própria interpolação `${VAR:?msg}` já em
# uso em `deploy/compose.yml:23-25` (`POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in
# .env}`), que não é flow-style nenhum — é o mesmo subconto que a seção "Mensagem de
# exceção" do `CLAUDE.md` já nomeou para regex de uma linha só. Enquanto o `rc=1` não
# mudar, flow-style fica FORA da cobertura desta regra, e esta task não finge o
# contrário — mesmo tratamento dado ao `Dockerfile` sem extensão (`harness.toml`, nota de
# `include_globs` acima).

# ── PONTEIRO DE PAPEL PRÓPRIO DO REPOSITÓRIO (V-16) ────────────────────────────────
#
