[docs]
# Único documento existente: o plano de discovery (objetivo, módulos A–D, entregáveis).
# Quando o discovery produzir avaliação crítica / decisões de arquitetura, elas entram
# aqui na ordem de leitura — proposta primeiro, decomposição depois.
bootstrap_docs = ["docs/proposta-discovery.md"]

# Precedência: exclude > include_globs > include_prefixes.
#
# ── PREMISSAS, e de onde vieram ────────────────────────────────────────────────────
#
# `backend/src/` + `*.py`: NÃO é suposição — o owner declarou a stack na criação do
# projeto (2026-08-22): "python modular com fastapi e next no front", estrutura nos
# moldes do comparador-preco (`backend/` + `frontend/`).
#
# `backend/src/` AINDA NÃO EXISTE. O validador responde V-12 ("code_paths que não casa
# nada") como AVISO e não erro, exatamente para política escrita antes do código. O
# aviso é ESPERADO hoje e some no primeiro módulo.
#
# ── ATUALIZAÇÃO 2026-08-28 (`T-01.1`): o primeiro módulo nasceu e o aviso morreu ────
#
# `backend/src/modules/sentimento/{domain,use_cases,infra}` existe. `[MEDIDO 2026-08-28:
# harness validate → 0 aviso, antes 1]`. O parágrafo acima fica como registro do estado
# em que a política foi escrita, não como descrição do disco.
#
# `backend/tests/` entrou em `include_prefixes` NESTA task, e a razão é medida: sem o
# prefixo, `harness code-paths classify backend/tests/test_x.py` responde **"não é
# código"** — nenhum prefixo casa — e as 3 regras `core` de escopo `code`
# (`relative-import`, `silent-except`, `print-statement`) não avaliam UMA LINHA da suíte
# que está nascendo. Com o prefixo, o arquivo passa a ser código e `test_globs`
# (`**/tests/**`) o mantém FORA de produção — que é exatamente a classificação certa.
# O layout é `backend/tests/` e não `backend/src/tests/` por duas razões: é a forma do
# vizinho que `ADR-009/D1` declara copiada, e é o alvo literal de
# `web-fullstack.server-test-directory-present` (`target = "backend/tests/**"`,
# `path-presence`), que `T-01.2` pode adotar sem ter de mover arquivo.
#
# ⚠️ MESMO BURACO DE GOVERNANÇA DO comparador-preco, herdado conscientemente:
# `include_globs = ["*.py"]` + `packs = ["core"]` (5 regras, todas `**/*.py`) significa
# que `frontend/` nascerá com ZERO regra cobrindo — e PARECENDO coberto, porque o
# `doctor` diz CONFORME sobre um universo que não o inclui. Fechar isto é: globs TS em
# `include_globs` + um pack que morda TypeScript. Enquanto isso, `frontend/` é ÁREA
# DECLARADAMENTE NÃO COBERTA.
#
# ── LACUNA DE `frontend/` FECHADA em 2026-08-28 por `T-01.2` ───────────────────────
#
# O parágrafo acima FICA como registro do estado em que a política foi escrita; ele
# deixou de descrever o disco. A receita que ele mesmo prescreveu foi executada nas
# TRÊS partes que o item `1.4` do plano diz que só valem juntas:
#
#   (a) `frontend/src/` em `include_prefixes`
#   (b) `*.ts` e `*.tsx` em `include_globs`
#   (c) o pack `web-fullstack` em `[rules].packs`
#
# **Medido antes, no repositório real, com `frontend/` inexistente:**
#
#   harness code-paths classify frontend/src/features/painel/serie.tsx
#   # -> nao-producao: nenhum include_prefixes casa ['backend/src/', 'backend/tests/']
#   harness rules --mode file --path frontend/src/features/painel/serie.tsx
#   # -> saída VAZIA, exit=0   (a lacuna de `D1.4`, re-medida hoje)
#
# **Medido depois, com um violador plantado de `browser-imports-server`:**
#
#   harness code-paths classify frontend/src/features/painel/serie.tsx
#   # -> producao: include_prefixes + include_globs casam e nada exclui
#   harness rules --mode file --path frontend/src/features/painel/serie.tsx --surface ci
#   # -> [BLOQUEIO] web-fullstack.browser-imports-server, exit=1
#   harness rules --mode file --path frontend/src/features/painel/Filtro.tsx --surface ci
#   # -> saída VAZIA, exit=0   (o outro lado: a regra CALA sobre código legítimo)
#
# `[MEDIDO 2026-08-28, universo 2 arquivos: 1 violador + 1 legítimo]`. **As duas metades
# são obrigatórias** (item `1.8'` do plano): "morde" sozinho não exclui um pack que
# reprove tudo, e "cala" sozinho é indistinguível de pack desligado.
#
# ⚠️ O CÓDIGO DE SAÍDA É FUNÇÃO DA SUPERFÍCIE, e citá-lo sem ela é meia medição. O DoD
# `D1.3` fala em `exit=2`; a superfície em que esse 2 aparece é a `posttool`, que é o
# DEFAULT de `--mode file` — não a `ci`. Mesmo arquivo, mesmo veredito, três leituras
# `[MEDIDO 2026-08-28: lib/runner.py:188, `surface = args.surface or ("posttool" if
# args.mode == "file" else "ci")`, mais a tabela de `decide()`]`:
#
#   --mode file, sem --surface   -> posttool -> {"decision": "block", …}   rc=2
#   --mode file --surface ci     -> ci       -> [BLOQUEIO] legível          rc=1
#   --mode file --surface git-hook -> git-hook -> [BLOQUEIO] legível        rc=1
#
# Corolário medido, e ele CONTRADIZ um aviso que circulava nesta feature: `harness rules
# --mode sweep` **NÃO** devolve `rc=0` imprimindo `[BLOQUEIO]`. O default de `--mode
# sweep` é a superfície `ci`, e com o violador plantado ele sai `rc=1`
# `[MEDIDO 2026-08-28: sweep com violador → rc=1; sweep sem violador → rc=0]`. O aviso
# valia para alguma versão anterior do mecanismo; em v0.13.0 não reproduz.
#
# **O violador NÃO ficou na árvore**, e a razão é medida: com ele presente,
# `harness rules --mode sweep --surface git-hook` sai `rc=1` e o `pre-push` recusa o
# push. A receita de 4 linhas que o reproduz do zero está em `frontend/README.md`.
#
# ⚠️ SEGUNDA ÁREA DECLARADAMENTE NÃO COBERTA: `backend/scripts/` — declarada em 2026-08-28
# pelo `/review` (item D). A lacuna de `frontend/` acima estava declarada, e a de
# `backend/tests/` foi medida e FECHADA nesta mesma task; esta terceira superfície ficou de
# fora das duas análises, e o silêncio é o defeito que `ADR-009/D3` nomeia — *"a diferença
# entre coberto e 'parecendo coberto'"*. Ela não é periférica: os **4 arquivos**
# (`bootstrap.sh`, `test.sh`, `lint.sh`, `check-coverage-layers.sh`; **216 linhas**
# `[MEDIDO 2026-08-28: cat backend/scripts/*.sh | wc -l]`) são o `test_cmd` inteiro, isto é
# **todo o DoD desta trilha daqui para frente** — e foi dentro de um deles que o mesmo
# `/review` achou o BLOQUEIO desta passada (`test.sh` media cobertura a partir de relatório
# velho).
#
# O comando que a mede, e as DUAS causas independentes que ele separa:
#
#   harness code-paths classify backend/scripts/test.sh
#   # -> nao-producao: nenhum include_prefixes casa ['backend/src/', 'backend/tests/']
#   harness code-paths classify backend/src/foo.sh
#   # -> nao-producao: nenhum include_globs casa
#
# `[MEDIDO 2026-08-28: os 4 `.sh` classificados um a um → 4 de 4 "nenhum include_prefixes
# casa"]`. Ou seja **nem o prefixo alcança `backend/scripts/`, nem o glob alcança `.sh`** —
# fechar exige as duas metades, exatamente como em `frontend/`.
#
# **NÃO fechada aqui, e o motivo é medido:** fechar exige `*.sh` em `include_globs` MAIS um
# pack cujas regras mordam shell, e **nenhum pack instalado morde `.sh`**
# `[MEDIDO 2026-08-28: grep -hE '^(paths|target) *=' packs/*/rules.toml | sort -u sobre os 4
# packs do plugin v0.13.0 (core, hexagonal-layers, read-model-projection, web-fullstack) →
# os alvos são `**/*.py`, `backend/**/*.py`, `frontend/src/**`, `backend/tests/**` e
# `frontend/src/**/*.test.*`; ZERO deles casa um `.sh` sob `backend/scripts/`]`. Declarar o
# glob sem regra que morda produziria exatamente o "parecendo coberto" que esta nota existe
# para impedir.
#
# **Dono PROPOSTO (proposta, não decisão — quem decide é `/architect`): `T-01.2`**, que já é
# a task de "cobertura fechada, medida por bloqueio devolvido" (`D1.3`/`D1.4`) e já tem de
# adotar um pack novo. O que a proposta cobra é **estender o título dela, hoje escrito só
# para `frontend/`**. Se a resposta for que `T-01.2` fica como está, esta lacuna **não tem
# dono** e precisa de task própria — e criar task não é ato de builder.
#
# **Falsificador desta declaração:** se `harness code-paths classify backend/scripts/test.sh`
# passar a responder `producao` ou `nao-producao: test_globs casa`, a lacuna deixou de
# existir e este parágrafo tem de sair.
#
# ⚠️ TERCEIRA SUPERFÍCIE, e ela NASCEU nesta task — declarada aqui para não ser
# descoberta depois: `test_globs` não reconhece teste de frontend. Os padrões vigentes
# são `**/tests/**` e `**/test_*.py`, e a convenção do vizinho para TS é
# `<nome>.test.tsx` `[DOC: ADR-009/D1, `vitest` em `frontend/`; e o próprio pack, cujo
# alvo é `frontend/src/**/*.test.*`]`. Logo, o primeiro `Filtro.test.tsx` que existir
# será classificado **produção** — que é a classificação ERRADA, e é o espelho exato do
# defeito que `backend/tests/` fechou nesta política em `T-01.1`
# `[MEDIDO 2026-08-28: `harness code-paths classify frontend/src/__sonda__/Filtro.test.tsx`
# → **rc=0**, "producao: … include_prefixes + include_globs casam e nada exclui"]`.
#
# **CORREÇÃO 2026-08-28 (`NEEDS_FIX` A1): a versão anterior deste parágrafo nomeava um
# mecanismo que não existe.** Ela dizia que `core.hardcoded-secret` (escopo `production`)
# "passará a avaliá-lo". Não passa, e a razão não é o escopo: **é o alvo**. Essa regra
# declara `paths = ["**/*.py"]`
# `[MEDIDO 2026-08-28: packs/core/rules.toml:50, pack `core` v0.13.0]`, e um `.tsx` nunca
# casa. Medido dos dois lados, MESMAS duas credenciais (`token = "abcdef123456"`,
# `api_key = "sk-live-0000000000"`):
#
#   rules --mode file --path frontend/src/__sonda__/Filtro.test.tsx --surface ci
#   # -> rc=0, saída de 0 byte
#   rules --mode file --path backend/src/__sonda_segredo__.py --surface ci
#   # -> rc=1, [BLOQUEIO] core.hardcoded-secret, "2 ocorrencia(s) fora da allowlist"
#
# **Hoje NENHUMA regra em vigor avalia um `.tsx` por escopo `production`**: as duas de
# escopo `production` (`core.hardcoded-secret`, `core.module-docstring-single-line`) têm
# alvo `**/*.py`, e as duas que alcançam `frontend/src/**`
# (`web-fullstack.browser-imports-server`, `web-fullstack.hardcoded-url`) são escopo
# `code`, que por construção cobre teste e produção IGUALMENTE
# `[MEDIDO 2026-08-28: `harness rules list` — 10 regras; lib/paths.py:105-124, `code` =
# prefixos ∩ globs − exclusões, `production` = `code` − `test_globs`]`. Ou seja: o
# veredito de regra sobre um `.test.tsx` é o MESMO classificado como produção ou como
# teste, e por isso a lacuna é **latente**, não ativa.
#
# **O que a classificação errada de fato alimenta**, e é por isso que ela continua sendo
# dívida: (i) a primeira regra de escopo `production` cujo alvo alcance `frontend/src/**`
# — hoje nenhuma, e é uma linha de pack; (ii) `harness require-push`, o portão de estado
# do `pre-push`, que exige que todo arquivo **de produção** do push seja reivindicado por
# feature autorizada e lê exatamente este classificador
# `[DOC: lib/runner.py:633, `lambda rel: classifier.is_production(...)`]`
# `[NÃO MEDIDO: medir exige um commit contendo um `.test.tsx` e um intervalo de push, e
# `T-01.2` está proibida de commitar]`.
#
# **NÃO fechada aqui, e o motivo é medido:** hoje o universo é ZERO
# `[MEDIDO 2026-08-28: `find frontend/src -name '*.test.*' | wc -l` → **0**]`. Declarar
# `**/*.test.*` agora seria escrever cobertura sobre universo vazio — a mesma coisa que
# a nota de `backend/scripts/` acima recusa fazer com `*.sh`. **Dono: a task que trouxer
# a suíte de frontend** (hoje inexistente — não há `[test_cmd.web]`, e por isso
# `web-fullstack.browser-test-file-present` fica ACESO como AVISO, deliberadamente:
# plantar um `.test.tsx` vazio produziria o "parecendo coberto" que `ADR-009/D3` recusa).
#
# **Falsificador:** no dia em que existir um `frontend/src/**/*.test.tsx`, se
# `harness code-paths classify` sobre ele responder `producao`, esta nota virou dívida
# vencida e `test_globs` tem de ganhar `**/*.test.*`.
[code_paths]
# `frontend/src/` entrou em 2026-08-28 (`T-01.2`), e é a parte (a) do item `1.4`.
include_prefixes = ["backend/src/", "backend/tests/", "frontend/src/"]
# `*.ts` e `*.tsx` entraram em 2026-08-28 (`T-01.2`), e são a parte (b) do item `1.4`.
# Sem eles o prefixo sozinho não basta: `explain()` responderia "nenhum include_globs
# casa" e o `.tsx` continuaria fora do escopo `code` de toda regra.
#
# ── A FAMÍLIA INTEIRA entrou em 2026-08-28 (`T-01.2`, correção do `NEEDS_FIX` A2) ──
#
# `*.ts`/`*.tsx` sozinhos deixavam o MESMO violador passar só por trocar de extensão
# `[MEDIDO 2026-08-28, mesmo import de `backend/src/` em três arquivos irmãos:
# `serie.tsx` → classify `producao`, `rules --mode file --surface ci` **rc=1** com
# `[BLOQUEIO] web-fullstack.browser-imports-server`; `serie.jsx` e `serie.js` →
# classify `nao-producao: nenhum include_globs casa`, `rules --mode file --surface ci`
# **rc=0 e 0 byte**, e `rules --mode sweep` rc=1 acusando SÓ o `.tsx`]`. Era a quarta
# superfície não coberta desta task, e ela nasceu sem declaração.
#
# **Por que aqui a resposta é FECHAR, e nas notas de `backend/scripts/` e `test_globs`
# acima é DECLARAR:** lá o bloqueio é que nenhum pack morde o alvo (`.sh`) ou que o
# universo é zero. Aqui **a regra já alcança o caminho**: o alvo de
# `web-fullstack.browser-imports-server` é `frontend/src/**`, sem extensão nenhuma
# `[MEDIDO 2026-08-28: packs/web-fullstack/rules.toml:16 → `paths = ["frontend/src/**"]`]`.
# Quem retinha o `.jsx` era exclusivamente esta lista. Declarar em vez de fechar seria
# deixar um `[BLOQUEIO]` pronto sem alcance por causa de um sufixo.
#
# **Custo medido, e ele é zero hoje:** os únicos `.js`/`.mjs` fora de `node_modules` são
# `scripts/validate_palette.js` e `frontend/eslint.config.mjs`, e **nenhum dos dois está
# sob `include_prefixes`** — o predicado de prefixo os recusa antes de a lista de globs
# ser consultada `[MEDIDO 2026-08-28: `find . -path ./frontend/node_modules -prune -o
# \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \) -print` → 2
# arquivos; `find backend -name '*.js'` → 0; `find frontend/src -name '*.js*'` → 0]`.
# `node_modules/` não entra na varredura por outra razão, independente desta lista: o
# caminhador do sweep o pula `[MEDIDO 2026-08-28: lib/rules.py:304, `skip = {'.git',
# 'node_modules', …}`]`.
#
# **O risco nomeado no review — `.js` gerado de build alcançado sob `frontend/src/`** —
# não se materializa hoje e é estrutural: o Next.js emite `.next/`, `next-env.d.ts` e
# `next.config.js` na RAIZ do pacote, e `include_prefixes` só alcança `frontend/src/`.
# A saída, se um dia gerar dentro de `src/`, é `exclude_globs` — não amputar a extensão.
#
# **Falsificador:** plante o mesmo import de `backend/src/` num arquivo novo sob
# `frontend/src/` com qualquer uma destas extensões; se `harness rules --mode file
# --path <ele> --surface ci` sair `rc=0` com 0 byte, esta lista voltou a decidir
# enforcement por sufixo e a linha abaixo está errada.
include_globs = ["*.py", "*.ts", "*.tsx", "*.mts", "*.cts", "*.js", "*.jsx", "*.mjs", "*.cjs"]
exclude_globs = [
    "**/__pycache__/**",
    "**/.venv/**",
    "**/migrations/**",
]
# `test_globs` guarda o que é código MAS NÃO É PRODUÇÃO.
test_globs = ["**/tests/**", "**/test_*.py"]

# ── LACUNA FECHADA em 2026-08-28 por `T-01.1` ──────────────────────────────────────
#
# O parágrafo que vivia aqui dizia: "não há suíte, não há runner, não há sequer
# `pyproject.toml`… esta tabela entra JUNTO COM O PRIMEIRO TESTE, e não antes."
# É o que aconteceu: `backend/pyproject.toml`, `backend/scripts/` e a primeira suíte
# nasceram no mesmo ato que esta tabela. `[MEDIDO 2026-08-28: harness policy --key
# test_cmd → deixou de ser `{}`]`.
#
# `sentimento` e SÓ `sentimento`, e o silêncio dos outros cinco componentes é
# declaração: `charts`, `convergencia`, `backtest` e `web` não têm código, e `docs` não
# tem o que rodar. Declarar um comando para eles seria reescrever a lacuna que este
# bloco acabou de fechar — um comando que falha por não existir.
#
# **O runner RECUSA (saída 3) se `backend/.venv` não existir** em vez de cair para o
# `python3` do PATH. O motivo é medido neste disco: hoje `python3` resolve para
# `…/harness-panel/.venv/bin/python3` (3.12.8) por vazamento de PATH, e o `pyenv` deste
# repositório resolveria 3.13.13 pelo `.python-version` — dois ambientes diferentes, o
# mesmo comando. Portão que roda em ambiente não declarado mede outra coisa.
# Preparar o ambiente: `bash backend/scripts/bootstrap.sh` (único passo com rede).
#
# ZERO REDE no portão: nenhum teste chama Binance, Bybit ou Coinalyze. `Q1` e `Q15`
# estão ABERTAS e coletor não roda em gate.
#
# ── `[test_cmd.web]` NÃO foi declarado em `T-01.2`, e o silêncio é deliberado ───────
#
# A task instalou o ESLint DO PROJETO (`frontend/package.json`, `frontend/eslint.config.mjs`)
# porque `ADR-011/D4` o adotou no lugar de duas `[[rules.own]]` de TypeScript, e porque
# `D1.3b` exige MEDIR que ele acerta os 3 arquivos de bancada. **Instalado não é portão.**
# Declarar `[test_cmd.web] lint = "npm --prefix frontend run lint"` aqui daria a APARÊNCIA
# de portão sem criar um: `test_cmd` não é lido por portão nenhum — quem o consome são os
# agentes `builder` e `qa` `[DOC: ADR-011, item 1.9 do plano, medição re-conferida em
# 2026-08-28]`. O caminho que de fato reprova é o do `ADR-011/D2`/`D3b`: um alvo no
# `Makefile` chamado por `scripts/hooks/pre-push.pre-harness`, e o `Makefile` é de `T-01.6`
# e o hook é de `T-01.5`. **Nenhuma das duas é esta task.** Escrever a chave agora seria
# declarar cobertura antes de existir o mecanismo que a cobra.
[test_cmd.sentimento]
lint = "bash backend/scripts/lint.sh"
test = "bash backend/scripts/test.sh"

[rules]
# Só o pack de ofício. Packs de topologia (`hexagonal-layers`, `web-fullstack`) cobram
# uma arquitetura que este repositório ainda não tem: não há camada para violar.
# `hexagonal-layers` é candidato natural quando `sentimento` e `backtest` ganharem
# forma — a proposta já separa domínio (matriz de convergência, motor de backtest) de
# borda (APIs de exchange, WebSocket), que é a fronteira que esse pack cobra.
#
# ── `web-fullstack` ADOTADO em 2026-08-28 por `T-01.2` — parte (c) do item `1.4` ────
#
# O parágrafo acima FICA: ele descreve por que o pack não entrou em 2026-08-22, e a
# razão que ele dá ("não há camada para violar") continua verdadeira para
# `hexagonal-layers`, que segue FORA. O que mudou é só `web-fullstack`: `frontend/src/`
# passou a existir, e `ADR-009/D3` mediu que **adotar o pack sozinho não resolve nada** —
# as regras dele são `scope = "code"`, e sem (a)+(b) o classificador não considera
# `frontend/` código. As três partes entram no mesmo ato ou nenhuma vale.
#
# **O que o pack acrescenta, e o efeito medido de cada regra sobre o disco de hoje:**
#
#   web-fullstack.browser-imports-server        BLOQUEIO · frontend/src/**
#     -> é a regra que fecha `D1.3`. Violador plantado: exit=2. Legítimo: exit=0.
#   web-fullstack.hardcoded-url                 AVISO    · frontend/src/**
#     -> 0 achado sobre os 4 arquivos de `frontend/src/` que ficam.
#   web-fullstack.server-test-directory-present BLOQUEIO · backend/tests/** (sweep)
#     -> PASSA: `backend/tests/` existe desde `T-01.1` (`helpers/`, `sentimento/`).
#        Foi por antecipar exatamente isto que `T-01.1` escolheu `backend/tests/` e não
#        `backend/src/tests/` — ver a nota de `include_prefixes` acima.
#   web-fullstack.browser-test-file-present     AVISO    · frontend/src/**/*.test.* (sweep)
#     -> ACENDE, e fica aceso DE PROPÓSITO. Não há suíte de frontend. Plantar um
#        `.test.tsx` vazio para apagar o aviso é o "parecendo coberto" que `ADR-009/D3`
#        recusa, e sem `[test_cmd.web]` nenhum portão o rodaria. O aviso é a declaração
#        honesta da lacuna; ele morre quando a suíte nascer, e não antes.
#   web-fullstack.tenant-from-request           BLOQUEIO · backend/**/*.py
#     -> **0 achado** sobre os 13 `.py` de `backend/` de hoje
#        `[MEDIDO 2026-08-28: harness rules --mode sweep, repositório inteiro, DEPOIS da
#        adoção do pack → nenhuma linha citando `tenant-from-request`]`. O risco era
#        travar a suíte Python inteira ao adotar o pack; não se realizou.
#        **E por isso NÃO existe `[[rules.web-fullstack.disabled]]` para ela:** desligar
#        regra que não acusou é escrever exceção sem caso, e a exceção sobreviveria ao
#        dia em que o código passar a ter multi-tenancy vindo do pedido.
packs = ["core", "web-fullstack"]

# ── SEM `[[rules.core.disabled]]` e sem `[[rules.own]]` ────────────────────────────
#
# Nenhuma regra desligada: não há código sobre o qual medir se ela acusa uso legítimo.
# Nenhuma regra própria: regra própria sem contagem que a justifique é palpite com
# severidade. As duas tabelas entram quando houver código — com o comando que as mediu.
#
# ── `T-01.1` (2026-08-28) declarou ZERO `[[rules.own]]`, e isto é escrito e não subentendido
#
# Item 1.8 do plano manda: "toda `[[rules.own]]` que esta fase declarar nasce com corpus".
# Esta task declarou nenhuma ⇒ **`D1.5` é satisfeito VACUAMENTE**, e o universo de
# `harness corpus verify` / `harness corpus mutate` nesta task é **0 regra**. Não é a mesma
# coisa que "rodei o corpus e passou": não havia o que rodar.
# Motivo de não declarar: as 4 regras `core` de bloqueio já cobrem o que este código escreve
# (`[MEDIDO 2026-08-28: harness rules --mode sweep, repositório inteiro → 0 achado; e o
# mesmo comando com dois violadores plantados devolveu 4 BLOQUEIOS, que é o que prova que
# o zero não é vazio. NÃO cito `--changed-only`: ele é `git diff --name-only HEAD`
# (`lib/runner.py:88`) e portanto CEGO a arquivo novo não rastreado — nesta task, em que
# tudo é arquivo novo, ele varre 0 arquivo e devolve verde sem medir nada]`), e a regra
# própria que esta fase de fato precisa — o contrato `forbidden` de import entre `charts` e
# `web` (`D1.6`) e o pack que morde TypeScript (`D1.3`) — pertence a `T-01.2`/`T-01.3`.
# Declará-la aqui seria escrever enforcement sem o corpus que o mede.
# Continua valendo, e agora com código no disco: `backend/src/` é 4 módulos e 107 statements
# — contagem pequena demais para justificar regra própria de arquitetura.

# ── PONTEIRO DE PAPEL PRÓPRIO DO REPOSITÓRIO (V-16) ────────────────────────────────
#
# Mesmo mecanismo do comparador-preco (lá: mobile), aqui para o domínio quantitativo:
# o owner precisa de julgamento especializado em SMC/order flow/microestrutura que os
# subagentes genéricos do plugin não carregam. O agente local supre esse julgamento no
# refinamento e na arquitetura dos componentes de domínio.
[agents.by_component.sentimento]
architect = ".claude/agents/quant-architect.md"

[agents.by_component.convergencia]
architect = ".claude/agents/quant-architect.md"

[agents.by_component.backtest]
architect = ".claude/agents/quant-architect.md"
