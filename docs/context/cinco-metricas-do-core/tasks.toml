#
# A narrativa e o racional vivem em `tasks_review.md`. O plano de execucao paralela vive em
# `PLANO-PARALELISMO.md` (`D8`, owner). Os tres NAO se sobrepoem: este arquivo nao argumenta
# e nao agenda; aquele nao e lido por maquina.
#
# A chave da feature e o campo `feature` ABAIXO, nunca o nome do diretorio (ADR-013/D4).
#
# ── A UNIDADE DE FASE E A FATIA VERTICAL (D1, owner) ───────────────────────────────
#
# coletor -> escritor -> md.series -> /api/v1/series-history -> painel com ponto visivel.
# Elo ausente => fase incompleta, mesmo com os outros quatro verdes. Toda fase paga os
# quatro itens do DoD-VERTICAL (D2, owner) e reprova se qualquer um der 0:
#   DoD-1 count(*) de md.series > 0 (Postgres REAL)
#   DoD-2 GET /api/v1/series-history -> n_points > 0
#   DoD-3 Playwright contra o app REAL: N >= 30 pontos distintos e NAO `SEM_PONTO` (RN-S2)
#   DoD-4 GET /api/v1/ingest-health -> run FECHADO com n_written > 0 (ADR-035)
# Emenda RN-S1: serie de 5m servida na grade de 1m conta BARRAS NATIVAS distintas
# (pontos_no_DOM / 5), nunca linhas da escada. Vale para as fases 03 e 04.
#
# ── TRACKER: DELIBERADO, NAO ESQUECIDO ─────────────────────────────────────────────
#
# `harness policy --key tracker` -> {kind=jira, project=CST, board_id=36} [MEDIDO 2026-09-10].
# NAO e `kind = none`: o destino esta declarado e identificado. O que falhou foi o ALCANCE —
# o servidor MCP atlassian exige OAuth e esta sessao e nao-interativa.
#
# Por isso as 50 tasks nascem `local_only = true` com `local_reason` DATADO. Nao e o
# marcador de "esqueci": nos sabemos exatamente que elas nao estao cardadas e por que.
# Um marcador que colapse "decidi" com "esqueci" faz o segundo nunca chamar atencao.
# Reversao: cada task troca local_only/local_reason por
# `tracker = { provider = "jira", id = "CST-nnn", url = "..." }` na MESMA edicao — o
# validador PROIBE os dois juntos (V-20), entao a troca nao pode ficar pela metade em silencio.
#
# ── TRILHA DO TOTAL: 43 -> 39 -> 50 ────────────────────────────────────────────────
#
# 43 itens numerados no plano; 39 tasks derivadas deles (7 fusoes, 1 cisao em `4.2`, 2
# reparticoes); +11 tasks que o plano exige e nao numerou (5 de `deploy`, 5 de `fechamento
# vertical`, mais `T-05.8`). Trilha item a item em `tasks_review.md` §1 e §7.
#
# ── O QUE NAO EXISTE AQUI, E CADA AUSENCIA E DECISAO ───────────────────────────────
#
# * conserto do `!forceOrder@arr` — D6 (owner) RECUSOU exigir data. Dono: plataforma-dados/T-07.11
