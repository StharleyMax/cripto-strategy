# Entrou DEPOIS da aprovacao da quebra, pelo mesmo caminho da T-00.4 (narrativa §9, na
# branch task/T-00.E2E). Autorizacao: [PREMISSA-OWNER: 2026-10-03] "apos a analise ja pode
# iniciar os ajustes e melhorias, dai pode entrar nessa memsa feature atual". Fontes, citadas
# por secao e nunca coladas: docs/context/piramide-de-testes/gates/{E2E,UNIT-FRONT,BACKEND}-analise.md.
#
# ── TRES REGRAS QUE VALEM PARA TODA TASK DESTA FASE ───────────────────────────────
#   REGRA-M (mordida): toda task que FUNDE, DESCE ou CORTA nomeia, por teste ou spec que sai
#     do lugar, a mutacao de origem (linha "(origem)" de E2E-analise §3/<spec>, o `git log`
#     do arquivo, ou o gate que a analise cita) e prova que ela AINDA reprova a suite depois
#     da mudanca. Se nenhuma mutacao morder depois, o teste NAO sai: fica, e o relatorio diz.
#   REGRA-T (tempo): antes e depois saem do MESMO comando, sozinho na maquina (um e2e por vez,
#     sob scratchpad/e2e.lock; nenhum verify ao lado). Antes = em $BASE, no inicio da task.
#     Ganho que nao foi medido nao fecha a task. No e2e, o tempo por spec e a soma das linhas
#     `✓` com a unidade ms|s|m convertida (o parser de E2E-analise §0; `1.2m` nao e 1,2 s).
#   REGRA-X (excecao ao DoD-2, task a task): M/D em frontend/e2e/ SO nos specs que a task
#     nomeia em ESCOPO (o mesmo padrao da T-00.4). Qualquer outro M/D em frontend/e2e/ reprova.
#
# DoD-5 (wc -l SymbolClient.tsx, B, N_fact) e G-2 NAO se aplicam a esta fase: nenhuma task
# move codigo de producao. A unica que toca producao e T-10.10, e so para acrescentar `export`;
# ela registra wc -l SymbolClient.tsx.
#
# Paralelismo: o e2e e serial por construcao (e2e.lock), entao as tasks de e2e formam uma
# cadeia; as de unitario do front e as de backend correm ao lado dela. Teto de 3 simultaneas.

