# argumenta, e aquele nao e lido por maquina. A chave da feature e o campo `feature`
# ABAIXO, nunca o nome do diretorio.
#
# ── A FASE E REFATORACAO SEM MUDANCA VISIVEL (SPEC-011 §7.1) ───────────────────────
#   DoD-1 nao-regressao de dado: as specs 08–14 dentro do `make e2e`
#   DoD-2 a tela e a mesma: `make e2e` inteiro verde E `git diff --name-status
#         $BASE..HEAD -- frontend/e2e/` sem M nem D em spec que ja existia em $BASE
#   DoD-3 ⛔ ABLACAO: cada task nomeia a mutacao que tem de reprovar o criterio dela
#   DoD-4 `make verify` verde, com run_in_background
#   DoD-5 na PR: `wc -l SymbolClient.tsx`, B (SPEC-011 §7.4) e, de F1 a F8, N_fact
#
# ── O QUE TODA TASK DECLARA EM `refs` ─────────────────────────────────────────────
#   agente:   frontend-builder (by_component.web.builder; charts nao declara builder)
#   e2e:      o portao DoD-2 + as specs que medem primeiro na fase
#   numstat:  `git diff --numstat $BASE..HEAD -- frontend/` gravado no relatorio e na
#             PR, com o que se espera dele
#   ablacao:  a mutacao que tem de reprovar
#   G-2:      de F1 a F9 (dependencia de OUTRA feature; nao cabe em depends_on)
#   $BASE = `git merge-base HEAD origin/master` no inicio da task.
#
# ── PARALELISMO ───────────────────────────────────────────────────────────────────
# F0: as 3 em paralelo. F1–F4: serie. F5, F6, F7, F8: quatro cadeias paralelas, NO
# MAXIMO 3 TASKS SIMULTANEAS; a C8 e a unica que edita chart/**. F9: T-09.4 corre ao
# lado de T-09.2/T-09.3. Wave = fase, exceto F5–F8, que sao UMA wave.
#
# ── APROVACAO ─────────────────────────────────────────────────────────────────────
# AINDA NAO APROVADO. A narrativa aguarda o owner; o ledger nao tem `approve tasks`.
#
# ── TRACKER ───────────────────────────────────────────────────────────────────────
# `harness policy --key tracker` -> {kind=jira, project=CST, board_id=36,
# parent_kind=Epic, child_kind=Tarefa} [MEDIDO 2026-10-02]. NENHUMA task tem `tracker`
# nem `local_only`, de proposito: card so nasce depois da aprovacao da narrativa, e
# ninguem decidiu NAO cardar. Sinal ambar consciente, ver `untracked_note`.

