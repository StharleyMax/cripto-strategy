    "4.3 — A LINHA 12 CONTINUA ABERTA: `NAO DECIDIDO`, com o dono (OWNER) e o CUSTO DE ADIAR escritos. Hoje e 1 rota; na fase 05 de `SPEC-001` sao muitas, e trocar URL depois quebra bookmark e link. A pergunta e barata agora e MONOTONICAMENTE MAIS CARA DEPOIS — mas NAO BLOQUEIA NADA. CA-F4-3: a linha contem o marcador de nao-decidido E a palavra `owner`.",
