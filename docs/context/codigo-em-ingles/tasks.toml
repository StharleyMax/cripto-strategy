# citam os dois tokens. CONSEQUENCIA OPERACIONAL, aplicada em `T-02.1` e `T-03.1`: o DoD
# NAO congela o `n`. O builder RE-MEDE no rev dele, declara `n > 0` por token ANTES do
# rename (e isso que `RN-8` compra — um `n=0` reprova no ato) e exige `0` DEPOIS. Os
# numeros do plano viram PISO DE SANIDADE, nao alvo.
#
# ── UNIDADE DA CONTAGEM: LINHAS, NAO OCORRENCIAS ───────────────────────────────────
#
# `ADR-015/D2` rotula a tabela como "n de OCORRENCIAS" e publica valores de LINHAS. O
# rotulo contradiz o valor, e a diferenca e real [MEDIDO 2026-08-29 em 7c3599b]:
#
#   git grep -n -F 'ROTAS' -- backend/src backend/tests frontend/src
#   frontend/src/app/rotas.ts:14:export const ROTAS = {
#   frontend/src/app/rotas.ts:18:export type Rota = (typeof ROTAS)[keyof typeof ROTAS];
#   -> 2 LINHAS, 3 OCORRENCIAS. O plano diz 2, logo o plano esta em linhas.
#
# Todo DoD deste arquivo fixa a unidade no proprio comando (`git grep -c` / `wc -l`
# sobre linhas). O lado CALA (`n = 0`) e identico nas duas unidades; a unidade so
# importa no lado MORDE.
#
# ── AS FASES 02 E 03 COMPARTILHAM UM ARQUIVO, E O `index.md` NEGA ──────────────────
