# o PARALELISMO CONTINUA SEGURO — o que e falso e a justificativa, nao a conclusao. As
# duas tasks declaram o compartilhamento: colisao de ARQUIVO, nao de LINHA. A segunda a
# mergear rebaseia, e `backend/README.md` no proprio diff NAO e sinal de erro.
