    "DoD: CA-F4-1 (a linha 10 contem `[INFERRED:` e NAO contem o marcador de nao-decidido) · CA-F4-2 · CA-F4-3 · CA-F4-4 · CA-F4-5 (os 9 eventos INTACTOS: `grep -rnE 'logger\\.(info|warning|debug|error)\\(\"' backend/src | wc -l` -> 9, com os 4 portugueses presentes por `grep -F` de cada um) · CA-F4-7 (`docs/INDEX.md` CRESCE, nao muda: zero linhas removidas).",
    "FALSIFICADOR DESTA FASE, observavel e barato: se, duas fases adiante, um evento de log NOVO nascer em portugues TENDO O `CLAUDE.md` NO CONTEXTO, a decisao prospectiva nao pegou e a superficie precisa de MECANISMO, nao de doutrina. Hoje sao 4 de 9, E O NUMERO DE PORTUGUESES NAO PODE SUBIR. Se subir, `ADR-013/D2e` volta a mesa com um caso concreto — e e a primeira vez nesta trilha que ele teria um.",
