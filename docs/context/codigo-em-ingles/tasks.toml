# EXPLICITA DO COORDENADOR em 2026-08-29: ele carda depois de o owner aprovar o `build`.
#
# As 7 tasks saem SEM `tracker` e SEM `local_only`, e a escolha e deliberada:
#   `tracker = {...}`                     = cardou.                      NAO e o caso.
#   `local_only = true` + `local_reason`  = o owner decidiu NAO cardar,  NAO e o caso —
