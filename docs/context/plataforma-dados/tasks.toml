    "DIVIDA HERDADA DE T-01.4 (1 de 3) — DERIVA DE PATCH, com causa medida e conserto de uma linha: `.python-version` declara 3.13.13 e o venv nasceu 3.13.12, porque `uv python find python3.13` prefere o CPython dele (~/.local/share/uv/python/cpython-3.13-...) ao do pyenv. O assert compara major.minor e aceita, entao NAO e regressao — mas `.python-version`, o arquivo que o owner mandou MANTER, hoje nao e honrado por comando nenhum deste repositorio (o pyenv do desenvolvedor o honra; o uv nao). Conserto medido: passar `\"$(command -v -- \"$candidato\")\"` em vez do nome. Registrada em backend/README.md §ERRATUM e trazida para ca porque o executor de T-01.6 nao tem obrigacao de abrir aquele README [/review 2026-08-28].",
