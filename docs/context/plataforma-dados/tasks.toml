#         (`T-05.2`, `T-08.2`), com o prefixo `CONTESTADO:` em `refs` — §2.2 do mesmo registro.
#
# `refs` e o veiculo escolhido, e a razao e medida: `TASK_KEYS` do validador
# (`scripts/tasks.sh:126`) e vocabulario FECHADO, e chave fora dele cai em V-09, cuja
# propria mensagem diz "chave IGNORADA pelo validador: nada a le, nada a valida"
