    "DIVIDA HERDADA DE T-01.4 (3 de 3) — `bootstrap.sh` NAO E IDEMPOTENTE: com o venv ja em disco sai `rc=2` (`uv venv` exige `--clear`). Nao trava ninguem hoje (o uv recusa antes de tocar no venv, e nenhum portao chama bootstrap.sh), mas esta task reescreve o arquivo e tem de resolver: `poetry install` sobre venv existente e idempotente por natureza.",
    "ACHADO DO /review 2026-08-28, e este e o mais grave dos quatro: NENHUM PORTAO CHAMA `bootstrap.sh`. O `.git/hooks/pre-push` roda `require-push` + `rules --mode sweep --surface git-hook`; `ls .github` -> inexistente; `ls Makefile` -> inexistente; e as tres mencoes a bootstrap.sh em lint.sh:9, test.sh:33 e check-coverage-layers.sh:24 sao TEXTO DE MENSAGEM DE ERRO, nao chamada. Logo o unico assert da versao EFETIVA do interpretador nao e executado por ninguem, e `mypy python_version` e declaracao de ALVO, nao checagem de interpretador — um venv 3.12 passaria o lint igual. Nenhum item de 01, nenhuma task e nenhum DoD reivindica esse portao. Esta task escreve o `Makefile`: ou nasce um alvo `make setup` que chame `bootstrap.sh`, ou a assercao de `backend/.venv/bin/python -V` entra em `lint.sh`. Decidir e nao deixar sem dono e obrigacao desta task.",
