    "O `Makefile` CHAMA `backend/scripts/*.sh`, NAO OS ABSORVE. Superficie unica na raiz: `setup`, ativacao da venv, `lint`, `test`, `boundaries`, `build`. Os quatro `.sh` continuam sendo a IMPLEMENTACAO; so `bootstrap.sh` muda de CONTEUDO (venv+uv -> `poetry install`), nunca de papel. E a forma do vizinho, que o owner mandou copiar [DOC: ADR-011/D2 — no `anything_monorepo`, `bootstrap`, `gate`, `hard-rules`, `artifacts`, `status`, `phase-gate`, `jira-sync`, `scaffold` e `hooks-install` sao todos `@bash scripts/<x>.sh`].",
    "POR QUE ABSORVER SERIA DEFEITO, e o motivo e MEDIDO no repositorio de referencia: uma receita de Make encadeia linhas por `;`, cada uma num subshell, e o recipe devolve o exit code do ULTIMO comando. O vizinho carrega o aviso literal no alvo `lint-frontend`: 'NOTE (KAN-172): set -e e OBRIGATORIO. Sem ele, o `;` entre os comandos faz o recipe retornar o exit code do ULTIMO comando (echo OK = 0), mascarando falha de eslint/tsc -> falso-verde local (o gate mente)'. OBRIGACAO NOVA QUE O `Makefile` ACRESCENTA: o alvo `test` NAO PODE encadear `pytest` e o piso de cobertura com `;`. Ou chama `bash backend/scripts/test.sh` (que ja os encadeia sob `set -euo pipefail`), ou a receita abre com `set -e`. A ADR decide a PRIMEIRA forma.",
    "`backend/poetry.toml` VERSIONADO com `[virtualenvs] in-project = true` NAO E DETALHE, e a ausencia dele quebra em clone limpo enquanto parece funcionar aqui: nesta maquina `in-project` e `true` por config de USUARIO, nao do repositorio [MEDIDO 2026-08-28: `cd /tmp && poetry config virtualenvs.in-project` -> `true` — lido de fora do repo, logo global]. Com o default de fabrica o venv nasce em `~/.cache/pypoetry/virtualenvs/` e as TRES recusas `rc=3` de 'venv nao existe' passam a disparar SEMPRE. O caminho literal esta ESPALHADO POR 4 ARQUIVOS e nao centralizado [MEDIDO 2026-08-28: `PY=\"$BACKEND/.venv/bin/python\"` -> 3 ocorrencias, em `lint.sh`, `test.sh` e `check-coverage-layers.sh`; mais `VENV=\"$BACKEND/.venv\"` -> 1, em `bootstrap.sh`].",
    "AS DUAS RECUSAS DO PISO SAO CONTRATO, nao detalhe de implementacao, e sao o ativo mais caro desta trilha (`D1.8`): relatorio AUSENTE -> `rc=3`; relatorio VELHO, medido por frescor contra o `.py` mais novo de `src/` -> `rc=3` nomeando o arquivo ofensor. As duas ficam INALTERADAS dentro de `check-coverage-layers.sh`, e o `rm -f coverage.xml` de `test.sh` fica junto. Verificacao (falsificador de ADR-011/D2): `bash backend/scripts/test.sh --no-cov -k <1 teste>` e `touch backend/src/modules/sentimento/domain/etl_backlog.py && bash backend/scripts/check-coverage-layers.sh`. Os dois valores de 'antes' estao publicados em `backend/README.md`: ambos `rc=3`. `rc` diferente de 3 em qualquer uma REPROVA a fase. E `rc=3` por 'venv nao existe' NAO CONTA como aprovacao — e exatamente a falha que o `poetry.toml` existe para impedir, e confundir as duas seria ler verde num portao que nao olhou.",
    "`requires-python = '>=3.13,<3.14'` em `[project]` E DESTA TASK, porque `[project]` so nasce aqui (Poetry 2.4.1 e PEP 621) e hoje o `backend/pyproject.toml` declara EM COMENTARIO que nao fixa versao de proposito. CONSEQUENCIA: `D1.9` e CONJUNTO de `T-01.4` (as outras 4 superficies) + `T-01.6` (esta) — nenhuma das duas o fecha sozinha. Ver o ref homonimo em `T-01.4`.",
